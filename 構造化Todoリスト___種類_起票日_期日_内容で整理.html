<!DOCTYPE html>
<html lang="ja">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover" />
  <meta name="apple-mobile-web-app-capable" content="yes" />
  <meta name="apple-mobile-web-app-status-bar-style" content="default" />
  <meta name="apple-mobile-web-app-title" content="Todoリスト" />
  <meta name="mobile-web-app-capable" content="yes" />
  <meta name="theme-color" content="#4f46e5" />
  <link rel="icon" type="image/svg+xml" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 64 64'%3E%3Crect width='64' height='64' rx='16' fill='%234f46e5'/%3E%3Cpath d='M20 33l8 8 16-18' fill='none' stroke='%23ffffff' stroke-width='6' stroke-linecap='round' stroke-linejoin='round'/%3E%3C/svg%3E" />
  <title>構造化Todoリスト — 種類・起票日・期日・内容で整理</title>
  <script src="https://cdn.tailwindcss.com/3.4.17"></script>
  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&family=Noto+Sans+JP:wght@400;500;600;700&display=swap" rel="stylesheet" />
  <style>
    body {
      font-family: 'Inter', 'Noto Sans JP', -apple-system, BlinkMacSystemFont, sans-serif;
      background-color: #f8fafc;
      color: #0f172a;
    }
    .line-clamp-2 {
      display: -webkit-box;
      -webkit-line-clamp: 2;
      -webkit-box-orient: vertical;
      overflow: hidden;
    }
    @keyframes fadeSlideUp {
      from { opacity: 0; transform: translateY(8px); }
      to { opacity: 1; transform: translateY(0); }
    }
    .toast-enter {
      animation: fadeSlideUp 0.2s ease-out forwards;
    }
  </style>
</head>
<body class="min-h-screen antialiased">
  <div class="max-w-6xl mx-auto px-4 sm:px-6 py-6">
    <!-- Header -->
    <header class="flex flex-col sm:flex-row sm:items-center sm:justify-between gap-4 mb-6">
      <div>
        <div class="flex items-center gap-2.5">
          <div class="w-9 h-9 rounded-xl bg-indigo-600 text-white flex items-center justify-center shadow-sm">
            <svg class="w-5 h-5" fill="none" stroke="currentColor" stroke-width="2" viewBox="0 0 24 24">
              <path stroke-linecap="round" stroke-linejoin="round" d="M9 5H7a2 2 0 00-2 2v12a2 2 0 002 2h10a2 2 0 002-2V7a2 2 0 00-2-2h-2M9 5a2 2 0 002 2h2a2 2 0 002-2M9 5a2 2 0 012-2h2a2 2 0 012 2m-6 9l2 2 4-4" />
            </svg>
          </div>
          <h1 class="text-xl sm:text-2xl font-bold tracking-tight text-slate-900">構造化 Todo リスト</h1>
        </div>
        <p class="text-sm text-slate-500 mt-1">Todo種類・起票日・期日・内容でタスクを整理して管理できます</p>
      </div>

      <div class="flex flex-wrap items-center gap-2">
        <button id="btn-manage-categories" type="button" class="inline-flex items-center gap-1.5 px-3 py-2 text-sm font-medium text-slate-700 bg-white border border-slate-200 rounded-lg hover:bg-slate-50 transition shadow-xs">
          <svg class="w-4 h-4 text-slate-500" fill="none" stroke="currentColor" stroke-width="2" viewBox="0 0 24 24">
            <path stroke-linecap="round" stroke-linejoin="round" d="M7 7h.01M7 3h5c.512 0 1.024.195 1.414.586l7 7a2 2 0 010 2.828l-7 7a2 2 0 01-2.828 0l-7-7A1.994 1.994 0 013 12V7a4 4 0 014-4z" />
          </svg>
          種類を管理
        </button>
        <button id="btn-export-csv" type="button" class="inline-flex items-center gap-1.5 px-3 py-2 text-sm font-medium text-slate-700 bg-white border border-slate-200 rounded-lg hover:bg-slate-50 transition shadow-xs">
          <svg class="w-4 h-4 text-slate-500" fill="none" stroke="currentColor" stroke-width="2" viewBox="0 0 24 24">
            <path stroke-linecap="round" stroke-linejoin="round" d="M4 16v1a3 3 0 003 3h10a3 3 0 003-3v-1m-4-4l-4 4m0 0l-4-4m4 4V4" />
          </svg>
          CSV保存
        </button>
        <button id="btn-open-add" type="button" class="inline-flex items-center gap-1.5 px-4 py-2 text-sm font-semibold text-white bg-indigo-600 rounded-lg hover:bg-indigo-700 transition shadow-sm">
          <svg class="w-4 h-4" fill="none" stroke="currentColor" stroke-width="2.2" viewBox="0 0 24 24">
            <path stroke-linecap="round" stroke-linejoin="round" d="M12 4v16m8-8H4" />
          </svg>
          新しいTodo
        </button>
      </div>
    </header>

    <!-- Summary Cards -->
    <section id="summary-cards" class="grid grid-cols-2 lg:grid-cols-4 gap-3 mb-6">
      <!-- Populated by JS -->
    </section>

    <!-- Quick Add Bar -->
    <section class="bg-white border border-slate-200 rounded-xl p-4 mb-6 shadow-xs">
      <form id="quick-add-form" class="grid grid-cols-1 sm:grid-cols-12 gap-3 items-end">
        <div class="sm:col-span-3">
          <label for="qa-category" class="block text-xs font-semibold text-slate-600 mb-1">Todo種類</label>
          <select id="qa-category" class="w-full px-3 py-2 text-sm bg-slate-50 border border-slate-200 rounded-lg focus:outline-none focus:ring-2 focus:ring-indigo-500 focus:bg-white"></select>
        </div>
        <div class="sm:col-span-2">
          <label for="qa-created" class="block text-xs font-semibold text-slate-600 mb-1">起票日</label>
          <input id="qa-created" type="date" required class="w-full px-3 py-2 text-sm bg-slate-50 border border-slate-200 rounded-lg focus:outline-none focus:ring-2 focus:ring-indigo-500 focus:bg-white" />
        </div>
        <div class="sm:col-span-2">
          <label for="qa-due" class="block text-xs font-semibold text-slate-600 mb-1">期日</label>
          <input id="qa-due" type="date" class="w-full px-3 py-2 text-sm bg-slate-50 border border-slate-200 rounded-lg focus:outline-none focus:ring-2 focus:ring-indigo-500 focus:bg-white" />
        </div>
        <div class="sm:col-span-4">
          <label for="qa-content" class="block text-xs font-semibold text-slate-600 mb-1">内容</label>
          <input id="qa-content" type="text" required placeholder="やることを入力..." class="w-full px-3 py-2 text-sm bg-slate-50 border border-slate-200 rounded-lg focus:outline-none focus:ring-2 focus:ring-indigo-500 focus:bg-white" />
        </div>
        <div class="sm:col-span-1">
          <button type="submit" class="w-full px-3 py-2 text-sm font-semibold text-white bg-slate-900 hover:bg-slate-800 rounded-lg transition">追加</button>
        </div>
      </form>
    </section>

    <!-- Controls: View Toggle, Filter, Search, Sort -->
    <section class="bg-white border border-slate-200 rounded-xl p-4 mb-4 shadow-xs space-y-3">
      <div class="flex flex-col md:flex-row md:items-center justify-between gap-3">
        <!-- View Switcher -->
        <div class="inline-flex rounded-lg bg-slate-100 p-1 self-start">
          <button id="view-table" type="button" class="px-3 py-1.5 text-xs font-semibold rounded-md transition">一覧テーブル</button>
          <button id="view-grouped" type="button" class="px-3 py-1.5 text-xs font-semibold rounded-md transition">種類別グループ</button>
        </div>

        <!-- Search & Sort -->
        <div class="flex flex-wrap items-center gap-2">
          <div class="relative flex-1 sm:w-56">
            <svg class="w-4 h-4 text-slate-400 absolute left-3 top-1/2 -translate-y-1/2 pointer-events-none" fill="none" stroke="currentColor" stroke-width="2" viewBox="0 0 24 24">
              <path stroke-linecap="round" stroke-linejoin="round" d="M21 21l-6-6m2-5a7 7 0 11-14 0 7 7 0 0114 0z" />
            </svg>
            <input id="filter-search" type="search" placeholder="内容・種類を検索..." class="w-full pl-9 pr-3 py-1.5 text-sm bg-slate-50 border border-slate-200 rounded-lg focus:outline-none focus:ring-2 focus:ring-indigo-500 focus:bg-white" />
          </div>
          <select id="filter-status" class="px-3 py-1.5 text-sm bg-slate-50 border border-slate-200 rounded-lg focus:outline-none focus:ring-2 focus:ring-indigo-500">
            <option value="active">未完了のみ</option>
            <option value="all">すべてのステータス</option>
            <option value="未着手">未着手</option>
            <option value="進行中">進行中</option>
            <option value="完了">完了</option>
          </select>
          <select id="sort-by" class="px-3 py-1.5 text-sm bg-slate-50 border border-slate-200 rounded-lg focus:outline-none focus:ring-2 focus:ring-indigo-500">
            <option value="dueAsc">期日が近い順</option>
            <option value="createdDesc">起票日が新しい順</option>
            <option value="priorityDesc">優先度が高い順</option>
            <option value="categoryAsc">Todo種類順</option>
          </select>
        </div>
      </div>

      <!-- Category Filter Pills -->
      <div id="category-pills" class="flex flex-wrap items-center gap-1.5 pt-1 border-t border-slate-100">
        <!-- Populated by JS -->
      </div>
    </section>

    <!-- Main Todo Content -->
    <main id="todo-container" class="space-y-4">
      <!-- Populated by JS -->
    </main>
  </div>

  <!-- Add / Edit Todo Modal -->
  <div id="todo-modal" class="fixed inset-0 z-50 hidden items-center justify-center bg-slate-900/50 backdrop-blur-xs p-4">
    <div class="bg-white rounded-2xl shadow-xl w-full max-w-lg overflow-hidden">
      <div class="flex items-center justify-between px-5 py-4 border-b border-slate-100">
        <h2 id="modal-title" class="text-base font-bold text-slate-900">新しいTodoを作成</h2>
        <button id="btn-close-modal" type="button" class="p-1.5 text-slate-400 hover:text-slate-600 rounded-lg hover:bg-slate-100">
          <svg class="w-5 h-5" fill="none" stroke="currentColor" stroke-width="2" viewBox="0 0 24 24">
            <path stroke-linecap="round" stroke-linejoin="round" d="M6 18L18 6M6 6l12 12" />
          </svg>
        </button>
      </div>
      <form id="todo-form" class="p-5 space-y-4">
        <input id="form-id" type="hidden" />
        <div class="grid grid-cols-1 sm:grid-cols-2 gap-4">
          <div>
            <label for="form-category" class="block text-xs font-semibold text-slate-700 mb-1">Todo種類 <span class="text-rose-500">*</span></label>
            <select id="form-category" required class="w-full px-3 py-2 text-sm border border-slate-200 rounded-lg focus:outline-none focus:ring-2 focus:ring-indigo-500"></select>
          </div>
          <div>
            <label for="form-status" class="block text-xs font-semibold text-slate-700 mb-1">ステータス</label>
            <select id="form-status" class="w-full px-3 py-2 text-sm border border-slate-200 rounded-lg focus:outline-none focus:ring-2 focus:ring-indigo-500">
              <option value="未着手">未着手</option>
              <option value="進行中">進行中</option>
              <option value="完了">完了</option>
            </select>
          </div>
        </div>

        <div class="grid grid-cols-1 sm:grid-cols-3 gap-4">
          <div>
            <label for="form-created" class="block text-xs font-semibold text-slate-700 mb-1">起票日 <span class="text-rose-500">*</span></label>
            <input id="form-created" type="date" required class="w-full px-3 py-2 text-sm border border-slate-200 rounded-lg focus:outline-none focus:ring-2 focus:ring-indigo-500" />
          </div>
          <div>
            <label for="form-due" class="block text-xs font-semibold text-slate-700 mb-1">期日</label>
            <input id="form-due" type="date" class="w-full px-3 py-2 text-sm border border-slate-200 rounded-lg focus:outline-none focus:ring-2 focus:ring-indigo-500" />
          </div>
          <div>
            <label for="form-priority" class="block text-xs font-semibold text-slate-700 mb-1">優先度</label>
            <select id="form-priority" class="w-full px-3 py-2 text-sm border border-slate-200 rounded-lg focus:outline-none focus:ring-2 focus:ring-indigo-500">
              <option value="高">高</option>
              <option value="中" selected>中</option>
              <option value="低">低</option>
            </select>
          </div>
        </div>

        <div>
          <label for="form-content" class="block text-xs font-semibold text-slate-700 mb-1">内容 <span class="text-rose-500">*</span></label>
          <textarea id="form-content" rows="3" required placeholder="具体的なタスク内容を入力..." class="w-full px-3 py-2 text-sm border border-slate-200 rounded-lg focus:outline-none focus:ring-2 focus:ring-indigo-500"></textarea>
        </div>

        <div>
          <label for="form-memo" class="block text-xs font-semibold text-slate-700 mb-1">補足メモ（任意）</label>
          <input id="form-memo" type="text" placeholder="関連リンク、担当者、場所など" class="w-full px-3 py-2 text-sm border border-slate-200 rounded-lg focus:outline-none focus:ring-2 focus:ring-indigo-500" />
        </div>

        <div class="flex items-center justify-end gap-2 pt-2 border-t border-slate-100">
          <button id="btn-cancel-modal" type="button" class="px-4 py-2 text-sm font-medium text-slate-600 hover:bg-slate-100 rounded-lg transition">キャンセル</button>
          <button type="submit" class="px-4 py-2 text-sm font-semibold text-white bg-indigo-600 hover:bg-indigo-700 rounded-lg transition">保存する</button>
        </div>
      </form>
    </div>
  </div>

  <!-- Category Management Modal -->
  <div id="category-modal" class="fixed inset-0 z-50 hidden items-center justify-center bg-slate-900/50 backdrop-blur-xs p-4">
    <div class="bg-white rounded-2xl shadow-xl w-full max-w-md overflow-hidden">
      <div class="flex items-center justify-between px-5 py-4 border-b border-slate-100">
        <h2 class="text-base font-bold text-slate-900">Todo種類の管理</h2>
        <button id="btn-close-cat-modal" type="button" class="p-1.5 text-slate-400 hover:text-slate-600 rounded-lg hover:bg-slate-100">
          <svg class="w-5 h-5" fill="none" stroke="currentColor" stroke-width="2" viewBox="0 0 24 24">
            <path stroke-linecap="round" stroke-linejoin="round" d="M6 18L18 6M6 6l12 12" />
          </svg>
        </button>
      </div>
      <div class="p-5 space-y-4">
        <form id="add-category-form" class="flex gap-2">
          <input id="new-cat-name" type="text" required placeholder="新しいTodo種類名..." class="flex-1 px-3 py-2 text-sm border border-slate-200 rounded-lg focus:outline-none focus:ring-2 focus:ring-indigo-500" />
          <select id="new-cat-color" class="px-2.5 py-2 text-sm border border-slate-200 rounded-lg bg-white">
            <option value="indigo">青紫</option>
            <option value="emerald">緑</option>
            <option value="amber">黄</option>
            <option value="rose">赤</option>
            <option value="sky">水色</option>
            <option value="violet">紫</option>
            <option value="slate">グレー</option>
          </select>
          <button type="submit" class="px-3.5 py-2 text-sm font-semibold text-white bg-indigo-600 hover:bg-indigo-700 rounded-lg transition">追加</button>
        </form>
        <div id="category-list" class="max-h-64 overflow-y-auto divide-y divide-slate-100 border border-slate-100 rounded-xl">
          <!-- Populated by JS -->
        </div>
      </div>
    </div>
  </div>

  <!-- Toast Container -->
  <div id="toast-container" class="fixed bottom-4 right-4 z-50 flex flex-col gap-2"></div>

  <script>
    (function () {
      const STORAGE_KEY_TODOS = 'structured_todos_v1';
      const STORAGE_KEY_CATS = 'structured_todo_cats_v1';

      const COLOR_STYLES = {
        indigo: { badge: 'bg-indigo-50 text-indigo-700 border-indigo-200', dot: 'bg-indigo-500' },
        emerald: { badge: 'bg-emerald-50 text-emerald-700 border-emerald-200', dot: 'bg-emerald-500' },
        amber: { badge: 'bg-amber-50 text-amber-800 border-amber-200', dot: 'bg-amber-500' },
        rose: { badge: 'bg-rose-50 text-rose-700 border-rose-200', dot: 'bg-rose-500' },
        sky: { badge: 'bg-sky-50 text-sky-700 border-sky-200', dot: 'bg-sky-500' },
        violet: { badge: 'bg-violet-50 text-violet-700 border-violet-200', dot: 'bg-violet-500' },
        slate: { badge: 'bg-slate-100 text-slate-700 border-slate-200', dot: 'bg-slate-500' }
      };

      const DEFAULT_CATEGORIES = [
        { id: 'cat-work', name: '仕事', color: 'indigo' },
        { id: 'cat-private', name: 'プライベート', color: 'emerald' },
        { id: 'cat-shopping', name: '買い物', color: 'amber' },
        { id: 'cat-admin', name: '連絡・手続き', color: 'sky' },
        { id: 'cat-study', name: '学習', color: 'violet' },
        { id: 'cat-other', name: 'その他', color: 'slate' }
      ];

      function getTodayStr() {
        const now = new Date();
        const y = now.getFullYear();
        const m = String(now.getMonth() + 1).padStart(2, '0');
        const d = String(now.getDate()).padStart(2, '0');
        return `${y}-${m}-${d}`;
      }

      function addDaysStr(baseStr, days) {
        const d = new Date(baseStr + 'T00:00:00');
        d.setDate(d.getDate() + days);
        return d.toISOString().slice(0, 10);
      }

      const today = getTodayStr();
      const DEFAULT_TODOS = [
        {
          id: 'todo-1',
          category: '仕事',
          status: '進行中',
          priority: '高',
          createdAt: today,
          dueDate: addDaysStr(today, 1),
          content: '週次定例ミーティングの資料レビューと論点整理',
          memo: '15時までに共有フォルダへ格納'
        },
        {
          id: 'todo-2',
          category: '連絡・手続き',
          status: '未着手',
          priority: '高',
          createdAt: today,
          dueDate: today,
          content: '健康診断の予約日程を確定して返信する',
          memo: '午前枠を優先'
        },
        {
          id: 'todo-3',
          category: '買い物',
          status: '未着手',
          priority: '中',
          createdAt: today,
          dueDate: addDaysStr(today, 3),
          content: 'コーヒー豆・洗剤・キッチンペーパーの補充',
          memo: ''
        },
        {
          id: 'todo-4',
          category: 'プライベート',
          status: '完了',
          priority: '低',
          createdAt: addDaysStr(today, -2),
          dueDate: addDaysStr(today, -1),
          content: '週末のレストラン予約を完了する',
          memo: '19:00〜 2名'
        }
      ];

      let state = {
        todos: [],
        categories: [],
        view: 'table', // 'table' | 'grouped'
        filterCategory: 'all',
        filterStatus: 'active',
        filterQuick: null, // null | 'dueSoon' | 'overdue'
        search: '',
        sortBy: 'dueAsc'
      };

      function loadState() {
        try {
          const savedCats = localStorage.getItem(STORAGE_KEY_CATS);
          const savedTodos = localStorage.getItem(STORAGE_KEY_TODOS);
          state.categories = savedCats ? JSON.parse(savedCats) : DEFAULT_CATEGORIES;
          state.todos = savedTodos ? JSON.parse(savedTodos) : DEFAULT_TODOS;
        } catch (e) {
          state.categories = DEFAULT_CATEGORIES;
          state.todos = DEFAULT_TODOS;
        }
      }

      function saveState() {
        try {
          localStorage.setItem(STORAGE_KEY_CATS, JSON.stringify(state.categories));
          localStorage.setItem(STORAGE_KEY_TODOS, JSON.stringify(state.todos));
        } catch (e) {
          // Ignore storage errors in restricted environments
        }
      }

      function escapeHtml(str) {
        return String(str || '')
          .replace(/&/g, '&amp;')
          .replace(/</g, '&lt;')
          .replace(/>/g, '&gt;')
          .replace(/"/g, '&quot;')
          .replace(/'/g, '&#39;');
      }

      function showToast(message, type = 'info') {
        const container = document.getElementById('toast-container');
        const el = document.createElement('div');
        const bg = type === 'success' ? 'bg-emerald-600' : type === 'error' ? 'bg-rose-600' : 'bg-slate-800';
        el.className = `toast-enter px-4 py-2.5 rounded-xl text-sm font-medium text-white shadow-lg ${bg}`;
        el.textContent = message;
        container.appendChild(el);
        setTimeout(() => {
          el.remove();
        }, 2800);
      }

      function getCategoryStyle(catName) {
        const found = state.categories.find(c => c.name === catName);
        const colorKey = found ? found.color : 'slate';
        return COLOR_STYLES[colorKey] || COLOR_STYLES.slate;
      }

      function getDueInfo(dueDate, status) {
        if (!dueDate) return { label: '期日なし', badgeClass: 'text-slate-400', diff: 99999, isOverdue: false, isDueSoon: false };
        if (status === '完了') return { label: dueDate.replace(/-/g, '/'), badgeClass: 'text-slate-400 line-through', diff: 9999, isOverdue: false, isDueSoon: false };
        const t = new Date(getTodayStr() + 'T00:00:00');
        const d = new Date(dueDate + 'T00:00:00');
        const diff = Math.round((d - t) / (1000 * 60 * 60 * 24));
        const formatted = dueDate.replace(/-/g, '/');
        if (diff < 0) {
          return { label: `${formatted} (${Math.abs(diff)}日超過)`, badgeClass: 'text-rose-600 font-semibold', diff, isOverdue: true, isDueSoon: false };
        }
        if (diff === 0) {
          return { label: `${formatted} (今日まで)`, badgeClass: 'text-amber-600 font-semibold', diff, isOverdue: false, isDueSoon: true };
        }
        if (diff <= 3) {
          return { label: `${formatted} (あと${diff}日)`, badgeClass: 'text-amber-600 font-medium', diff, isOverdue: false, isDueSoon: true };
        }
        return { label: `${formatted} (あと${diff}日)`, badgeClass: 'text-slate-600', diff, isOverdue: false, isDueSoon: false };
      }

      function populateCategorySelects() {
        const selects = [document.getElementById('qa-category'), document.getElementById('form-category')];
        selects.forEach(sel => {
          const prev = sel.value;
          sel.innerHTML = state.categories.map(c => `<option value="${escapeHtml(c.name)}">${escapeHtml(c.name)}</option>`).join('');
          if (prev && state.categories.some(c => c.name === prev)) {
            sel.value = prev;
          }
        });
      }

      function getFilteredSortedTodos() {
        const q = state.search.trim().toLowerCase();
        const filtered = state.todos.filter(todo => {
          if (state.filterCategory !== 'all' && todo.category !== state.filterCategory) return false;
          if (state.filterStatus === 'active' && todo.status === '完了') return false;
          if (state.filterStatus !== 'all' && state.filterStatus !== 'active' && todo.status !== state.filterStatus) return false;

          const dueInfo = getDueInfo(todo.dueDate, todo.status);
          if (state.filterQuick === 'overdue' && !dueInfo.isOverdue) return false;
          if (state.filterQuick === 'dueSoon' && !dueInfo.isDueSoon) return false;

          if (q) {
            const hay = `${todo.category} ${todo.content} ${todo.memo || ''}`.toLowerCase();
            if (!hay.includes(q)) return false;
          }
          return true;
        });

        const prioRank = { '高': 3, '中': 2, '低': 1 };
        filtered.sort((a, b) => {
          if (state.sortBy === 'dueAsc') {
            const da = a.dueDate || '9999-12-31';
            const db = b.dueDate || '9999-12-31';
            return da.localeCompare(db);
          }
          if (state.sortBy === 'createdDesc') {
            return (b.createdAt || '').localeCompare(a.createdAt || '');
          }
          if (state.sortBy === 'priorityDesc') {
            return (prioRank[b.priority] || 0) - (prioRank[a.priority] || 0);
          }
          if (state.sortBy === 'categoryAsc') {
            return a.category.localeCompare(b.category, 'ja');
          }
          return 0;
        });
        return filtered;
      }

      function renderSummary() {
        const total = state.todos.length;
        const incomplete = state.todos.filter(t => t.status !== '完了').length;
        const dueSoon = state.todos.filter(t => getDueInfo(t.dueDate, t.status).isDueSoon).length;
        const overdue = state.todos.filter(t => getDueInfo(t.dueDate, t.status).isOverdue).length;

        const cards = [
          { key: 'all', label: '全タスク', value: total, sub: `完了 ${total - incomplete}件`, ring: state.filterQuick === null && state.filterStatus === 'all' },
          { key: 'active', label: '未完了', value: incomplete, sub: '進行中・未着手', ring: state.filterQuick === null && state.filterStatus === 'active' },
          { key: 'dueSoon', label: '今日〜3日以内', value: dueSoon, sub: '期限間近のタスク', accent: 'text-amber-600', ring: state.filterQuick === 'dueSoon' },
          { key: 'overdue', label: '期限超過', value: overdue, sub: '早めの対応が必要', accent: overdue > 0 ? 'text-rose-600' : 'text-slate-900', ring: state.filterQuick === 'overdue' }
        ];

        document.getElementById('summary-cards').innerHTML = cards.map(c => `
          <button type="button" data-summary-filter="${c.key}" class="text-left bg-white border ${c.ring ? 'border-indigo-500 ring-2 ring-indigo-100' : 'border-slate-200 hover:border-slate-300'} rounded-xl p-3.5 shadow-xs transition">
            <div class="text-xs font-medium text-slate-500">${c.label}</div>
            <div class="text-2xl font-bold mt-1 ${c.accent || 'text-slate-900'}">${c.value}<span class="text-xs font-normal text-slate-400 ml-1">件</span></div>
            <div class="text-[11px] text-slate-400 mt-0.5">${c.sub}</div>
          </button>
        `).join('');
      }

      function renderCategoryPills() {
        const counts = {};
        state.todos.forEach(t => {
          if (state.filterStatus === 'active' && t.status === '完了') return;
          counts[t.category] = (counts[t.category] || 0) + 1;
        });

        const totalShown = Object.values(counts).reduce((a, b) => a + b, 0);
        let html = `<button type="button" data-cat-filter="all" class="px-2.5 py-1 rounded-full text-xs font-medium transition ${state.filterCategory === 'all' ? 'bg-slate-900 text-white' : 'bg-slate-100 text-slate-600 hover:bg-slate-200'}">すべて (${totalShown})</button>`;

        state.categories.forEach(c => {
          const active = state.filterCategory === c.name;
          const cnt = counts[c.name] || 0;
          const st = getCategoryStyle(c.name);
          html += `<button type="button" data-cat-filter="${escapeHtml(c.name)}" class="inline-flex items-center gap-1.5 px-2.5 py-1 rounded-full text-xs font-medium border transition ${active ? 'bg-indigo-600 text-white border-indigo-600' : `${st.badge} hover:opacity-85`}">
            <span class="w-1.5 h-1.5 rounded-full ${active ? 'bg-white' : st.dot}"></span>
            ${escapeHtml(c.name)} (${cnt})
          </button>`;
        });

        document.getElementById('category-pills').innerHTML = html;
      }

      function renderViewToggle() {
        const tblBtn = document.getElementById('view-table');
        const grpBtn = document.getElementById('view-grouped');
        if (state.view === 'table') {
          tblBtn.className = 'px-3 py-1.5 text-xs font-semibold rounded-md bg-white text-slate-900 shadow-xs';
          grpBtn.className = 'px-3 py-1.5 text-xs font-semibold rounded-md text-slate-500 hover:text-slate-700';
        } else {
          grpBtn.className = 'px-3 py-1.5 text-xs font-semibold rounded-md bg-white text-slate-900 shadow-xs';
          tblBtn.className = 'px-3 py-1.5 text-xs font-semibold rounded-md text-slate-500 hover:text-slate-700';
        }
      }

      function statusBadgeHtml(todo) {
        const styles = {
          '未着手': 'bg-slate-100 text-slate-700 hover:bg-slate-200',
          '進行中': 'bg-blue-50 text-blue-700 border border-blue-200 hover:bg-blue-100',
          '完了': 'bg-emerald-50 text-emerald-700 border border-emerald-200 hover:bg-emerald-100'
        };
        return `<button type="button" data-action="cycle-status" data-id="${todo.id}" title="クリックでステータスを切り替え" class="px-2.5 py-0.5 rounded-full text-xs font-medium transition ${styles[todo.status] || styles['未着手']}">${escapeHtml(todo.status)}</button>`;
      }

      function priorityBadgeHtml(priority) {
        if (priority === '高') return '<span class="text-xs font-semibold text-rose-600">● 高</span>';
        if (priority === '中') return '<span class="text-xs font-medium text-amber-600">● 中</span>';
        return '<span class="text-xs text-slate-400">● 低</span>';
      }

      function renderTodos() {
        const list = getFilteredSortedTodos();
        const container = document.getElementById('todo-container');

        if (list.length === 0) {
          container.innerHTML = `
            <div class="bg-white border border-dashed border-slate-300 rounded-xl p-10 text-center">
              <p class="text-sm font-medium text-slate-600">該当するTodoがありません</p>
              <p class="text-xs text-slate-400 mt-1">上の入力欄から新しく追加するか、フィルタ条件を変更してください</p>
            </div>
          `;
          return;
        }

        if (state.view === 'table') {
          const rows = list.map(t => {
            const catStyle = getCategoryStyle(t.category);
            const dueInfo = getDueInfo(t.dueDate, t.status);
            const isDone = t.status === '完了';
            return `
              <tr class="hover:bg-slate-50/80 transition ${isDone ? 'opacity-65' : ''}">
                <td class="px-4 py-3 whitespace-nowrap">
                  <span class="inline-flex items-center gap-1.5 px-2.5 py-0.5 rounded-full text-xs font-medium border ${catStyle.badge}">
                    <span class="w-1.5 h-1.5 rounded-full ${catStyle.dot}"></span>
                    ${escapeHtml(t.category)}
                  </span>
                </td>
                <td class="px-3 py-3 whitespace-nowrap">${statusBadgeHtml(t)}</td>
                <td class="px-3 py-3 whitespace-nowrap text-xs text-slate-500">${escapeHtml((t.createdAt || '').replace(/-/g, '/'))}</td>
                <td class="px-3 py-3 whitespace-nowrap text-xs ${dueInfo.badgeClass}">${escapeHtml(dueInfo.label)}</td>
                <td class="px-3 py-3 whitespace-nowrap">${priorityBadgeHtml(t.priority)}</td>
                <td class="px-4 py-3 min-w-[220px]">
                  <div class="text-sm font-medium text-slate-900 ${isDone ? 'line-through text-slate-500' : ''}">${escapeHtml(t.content)}</div>
                  ${t.memo ? `<div class="text-xs text-slate-400 mt-0.5">${escapeHtml(t.memo)}</div>` : ''}
                </td>
                <td class="px-4 py-3 whitespace-nowrap text-right">
                  <div class="inline-flex items-center gap-1">
                    <button type="button" data-action="edit" data-id="${t.id}" class="p-1.5 text-slate-400 hover:text-indigo-600 rounded-lg hover:bg-indigo-50 transition" title="編集">
                      <svg class="w-4 h-4" fill="none" stroke="currentColor" stroke-width="2" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" d="M11 5H6a2 2 0 00-2 2v11a2 2 0 002 2h11a2 2 0 002-2v-5m-1.414-9.414a2 2 0 112.828 2.828L11.828 15H9v-2.828l8.586-8.586z" /></svg>
                    </button>
                    <button type="button" data-action="delete" data-id="${t.id}" class="p-1.5 text-slate-400 hover:text-rose-600 rounded-lg hover:bg-rose-50 transition" title="削除">
                      <svg class="w-4 h-4" fill="none" stroke="currentColor" stroke-width="2" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" d="M19 7l-.867 12.142A2 2 0 0116.138 21H7.862a2 2 0 01-1.995-1.858L5 7m5 4v6m4-6v6m1-10V4a1 1 0 00-1-1h-4a1 1 0 00-1 1v3M4 7h16" /></svg>
                    </button>
                  </div>
                </td>
              </tr>
            `;
          }).join('');

          container.innerHTML = `
            <div class="bg-white border border-slate-200 rounded-xl shadow-xs overflow-hidden">
              <div class="overflow-x-auto">
                <table class="w-full text-left border-collapse">
                  <thead>
                    <tr class="bg-slate-50 border-b border-slate-200 text-[11px] font-semibold text-slate-500 uppercase tracking-wider">
                      <th class="px-4 py-3">Todo種類</th>
                      <th class="px-3 py-3">ステータス</th>
                      <th class="px-3 py-3">起票日</th>
                      <th class="px-3 py-3">期日</th>
                      <th class="px-3 py-3">優先度</th>
                      <th class="px-4 py-3">内容</th>
                      <th class="px-4 py-3 text-right">操作</th>
                    </tr>
                  </thead>
                  <tbody class="divide-y divide-slate-100">${rows}</tbody>
                </table>
              </div>
            </div>
          `;
        } else {
          // Grouped by Todo種類
          const groups = {};
          list.forEach(t => {
            if (!groups[t.category]) groups[t.category] = [];
            groups[t.category].push(t);
          });

          container.innerHTML = Object.entries(groups).map(([catName, items]) => {
            const catStyle = getCategoryStyle(catName);
            const cardsHtml = items.map(t => {
              const dueInfo = getDueInfo(t.dueDate, t.status);
              const isDone = t.status === '完了';
              return `
                <div class="p-3.5 flex flex-col sm:flex-row sm:items-center justify-between gap-3 hover:bg-slate-50/70 transition ${isDone ? 'opacity-65' : ''}">
                  <div class="space-y-1 flex-1">
                    <div class="flex flex-wrap items-center gap-2">
                      ${statusBadgeHtml(t)}
                      ${priorityBadgeHtml(t.priority)}
                      <span class="text-xs text-slate-400">起票: ${escapeHtml((t.createdAt || '').replace(/-/g, '/'))}</span>
                      <span class="text-xs ${dueInfo.badgeClass}">期日: ${escapeHtml(dueInfo.label)}</span>
                    </div>
                    <div class="text-sm font-medium text-slate-900 ${isDone ? 'line-through text-slate-500' : ''}">${escapeHtml(t.content)}</div>
                    ${t.memo ? `<div class="text-xs text-slate-400">${escapeHtml(t.memo)}</div>` : ''}
                  </div>
                  <div class="flex items-center gap-1 self-end sm:self-center">
                    <button type="button" data-action="edit" data-id="${t.id}" class="px-2.5 py-1 text-xs font-medium text-slate-600 hover:text-indigo-600 hover:bg-indigo-50 rounded-lg transition">編集</button>
                    <button type="button" data-action="delete" data-id="${t.id}" class="px-2.5 py-1 text-xs font-medium text-slate-500 hover:text-rose-600 hover:bg-rose-50 rounded-lg transition">削除</button>
                  </div>
                </div>
              `;
            }).join('');

            return `
              <div class="bg-white border border-slate-200 rounded-xl shadow-xs overflow-hidden">
                <div class="px-4 py-2.5 bg-slate-50 border-b border-slate-200 flex items-center justify-between">
                  <div class="flex items-center gap-2">
                    <span class="w-2.5 h-2.5 rounded-full ${catStyle.dot}"></span>
                    <h3 class="text-sm font-bold text-slate-800">${escapeHtml(catName)}</h3>
                  </div>
                  <span class="text-xs font-semibold text-slate-500">${items.length}件</span>
                </div>
                <div class="divide-y divide-slate-100">${cardsHtml}</div>
              </div>
            `;
          }).join('');
        }
      }

      function renderCategoryModalList() {
        const listEl = document.getElementById('category-list');
        listEl.innerHTML = state.categories.map(c => {
          const st = getCategoryStyle(c.name);
          const count = state.todos.filter(t => t.category === c.name).length;
          return `
            <div class="flex items-center justify-between px-3.5 py-2.5">
              <div class="flex items-center gap-2">
                <span class="w-2.5 h-2.5 rounded-full ${st.dot}"></span>
                <span class="text-sm font-medium text-slate-800">${escapeHtml(c.name)}</span>
                <span class="text-xs text-slate-400">(${count}件)</span>
              </div>
              <button type="button" data-delete-cat="${c.id}" class="text-xs text-rose-600 hover:text-rose-700 font-medium px-2 py-1 rounded hover:bg-rose-50 transition">削除</button>
            </div>
          `;
        }).join('');
      }

      function renderAll() {
        populateCategorySelects();
        renderSummary();
        renderCategoryPills();
        renderViewToggle();
        renderTodos();
      }

      function openTodoModal(todo = null) {
        const modal = document.getElementById('todo-modal');
        document.getElementById('modal-title').textContent = todo ? 'Todoを編集' : '新しいTodoを作成';
        document.getElementById('form-id').value = todo ? todo.id : '';
        document.getElementById('form-category').value = todo ? todo.category : (state.categories[0]?.name || 'その他');
        document.getElementById('form-status').value = todo ? todo.status : '未着手';
        document.getElementById('form-created').value = todo ? todo.createdAt : getTodayStr();
        document.getElementById('form-due').value = todo ? (todo.dueDate || '') : '';
        document.getElementById('form-priority').value = todo ? todo.priority : '中';
        document.getElementById('form-content').value = todo ? todo.content : '';
        document.getElementById('form-memo').value = todo ? (todo.memo || '') : '';
        modal.classList.remove('hidden');
        modal.classList.add('flex');
      }

      function closeTodoModal() {
        const modal = document.getElementById('todo-modal');
        modal.classList.add('hidden');
        modal.classList.remove('flex');
      }

      function openCategoryModal() {
        renderCategoryModalList();
        const modal = document.getElementById('category-modal');
        modal.classList.remove('hidden');
        modal.classList.add('flex');
      }

      function closeCategoryModal() {
        const modal = document.getElementById('category-modal');
        modal.classList.add('hidden');
        modal.classList.remove('flex');
      }

      function exportCsv() {
        const headers = ['Todo種類', 'ステータス', '優先度', '起票日', '期日', '内容', 'メモ'];
        const rows = state.todos.map(t => [
          t.category, t.status, t.priority, t.createdAt, t.dueDate || '', t.content, t.memo || ''
        ].map(v => `"${String(v).replace(/"/g, '""')}"`).join(','));
        const csvContent = '\uFEFF' + [headers.join(','), ...rows].join('\n');
        const blob = new Blob([csvContent], { type: 'text/csv;charset=utf-8;' });
        const url = URL.createObjectURL(blob);
        const a = document.createElement('a');
        a.href = url;
        a.download = `todo_list_${getTodayStr()}.csv`;
        document.body.appendChild(a);
        a.click();
        a.remove();
        URL.revokeObjectURL(url);
        showToast('CSVファイルをダウンロードしました', 'success');
      }

      // Event Listeners
      document.getElementById('qa-created').value = getTodayStr();

      document.getElementById('quick-add-form').addEventListener('submit', e => {
        e.preventDefault();
        const category = document.getElementById('qa-category').value;
        const createdAt = document.getElementById('qa-created').value || getTodayStr();
        const dueDate = document.getElementById('qa-due').value;
        const content = document.getElementById('qa-content').value.trim();
        if (!content) return;

        state.todos.unshift({
          id: 'todo-' + Date.now(),
          category,
          status: '未着手',
          priority: '中',
          createdAt,
          dueDate,
          content,
          memo: ''
        });
        saveState();
        document.getElementById('qa-content').value = '';
        document.getElementById('qa-due').value = '';
        renderAll();
        showToast('Todoを追加しました', 'success');
      });

      document.getElementById('btn-open-add').addEventListener('click', () => openTodoModal(null));
      document.getElementById('btn-close-modal').addEventListener('click', closeTodoModal);
      document.getElementById('btn-cancel-modal').addEventListener('click', closeTodoModal);

      document.getElementById('todo-form').addEventListener('submit', e => {
        e.preventDefault();
        const id = document.getElementById('form-id').value;
        const payload = {
          category: document.getElementById('form-category').value,
          status: document.getElementById('form-status').value,
          createdAt: document.getElementById('form-created').value,
          dueDate: document.getElementById('form-due').value,
          priority: document.getElementById('form-priority').value,
          content: document.getElementById('form-content').value.trim(),
          memo: document.getElementById('form-memo').value.trim()
        };
        if (!payload.content) return;

        if (id) {
          const idx = state.todos.findIndex(t => t.id === id);
          if (idx !== -1) state.todos[idx] = { ...state.todos[idx], ...payload };
          showToast('Todoを更新しました', 'success');
        } else {
          state.todos.unshift({ id: 'todo-' + Date.now(), ...payload });
          showToast('Todoを作成しました', 'success');
        }
        saveState();
        closeTodoModal();
        renderAll();
      });

      document.getElementById('btn-manage-categories').addEventListener('click', openCategoryModal);
      document.getElementById('btn-close-cat-modal').addEventListener('click', closeCategoryModal);
      document.getElementById('btn-export-csv').addEventListener('click', exportCsv);

      document.getElementById('add-category-form').addEventListener('submit', e => {
        e.preventDefault();
        const name = document.getElementById('new-cat-name').value.trim();
        const color = document.getElementById('new-cat-color').value;
        if (!name) return;
        if (state.categories.some(c => c.name === name)) {
          showToast('同じ名前のTodo種類がすでに存在します', 'error');
          return;
        }
        state.categories.push({ id: 'cat-' + Date.now(), name, color });
        document.getElementById('new-cat-name').value = '';
        saveState();
        renderCategoryModalList();
        renderAll();
        showToast(`種類「${name}」を追加しました`, 'success');
      });

      document.getElementById('category-list').addEventListener('click', e => {
        const btn = e.target.closest('[data-delete-cat]');
        if (!btn) return;
        if (state.categories.length <= 1) {
          showToast('Todo種類は最低1つ必要です', 'error');
          return;
        }
        const id = btn.getAttribute('data-delete-cat');
        state.categories = state.categories.filter(c => c.id !== id);
        if (state.filterCategory !== 'all' && !state.categories.some(c => c.name === state.filterCategory)) {
          state.filterCategory = 'all';
        }
        saveState();
        renderCategoryModalList();
        renderAll();
        showToast('Todo種類を削除しました');
      });

      document.getElementById('view-table').addEventListener('click', () => {
        state.view = 'table';
        renderViewToggle();
        renderTodos();
      });

      document.getElementById('view-grouped').addEventListener('click', () => {
        state.view = 'grouped';
        renderViewToggle();
        renderTodos();
      });

      document.getElementById('filter-search').addEventListener('input', e => {
        state.search = e.target.value;
        renderTodos();
      });

      document.getElementById('filter-status').addEventListener('change', e => {
        state.filterStatus = e.target.value;
        state.filterQuick = null;
        renderAll();
      });

      document.getElementById('sort-by').addEventListener('change', e => {
        state.sortBy = e.target.value;
        renderTodos();
      });

      document.getElementById('summary-cards').addEventListener('click', e => {
        const btn = e.target.closest('[data-summary-filter]');
        if (!btn) return;
        const key = btn.getAttribute('data-summary-filter');
        if (key === 'all' || key === 'active') {
          state.filterStatus = key;
          state.filterQuick = null;
          document.getElementById('filter-status').value = key;
        } else {
          state.filterQuick = state.filterQuick === key ? null : key;
          state.filterStatus = 'active';
          document.getElementById('filter-status').value = 'active';
        }
        renderAll();
      });

      document.getElementById('category-pills').addEventListener('click', e => {
        const btn = e.target.closest('[data-cat-filter]');
        if (!btn) return;
        state.filterCategory = btn.getAttribute('data-cat-filter');
        renderCategoryPills();
        renderTodos();
      });

      document.getElementById('todo-container').addEventListener('click', e => {
        const btn = e.target.closest('[data-action]');
        if (!btn) return;
        const action = btn.getAttribute('data-action');
        const id = btn.getAttribute('data-id');
        const todo = state.todos.find(t => t.id === id);
        if (!todo) return;

        if (action === 'cycle-status') {
          const order = ['未着手', '進行中', '完了'];
          const next = order[(order.indexOf(todo.status) + 1) % order.length];
          todo.status = next;
          saveState();
          renderAll();
          showToast(`ステータスを「${next}」に変更しました`);
        } else if (action === 'edit') {
          openTodoModal(todo);
        } else if (action === 'delete') {
          state.todos = state.todos.filter(t => t.id !== id);
          saveState();
          renderAll();
          showToast('Todoを削除しました');
        }
      });

      loadState();
      renderAll();
    })();
  </script>
</body>
</html>
